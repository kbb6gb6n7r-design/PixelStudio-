<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"><meta name="theme-color" content="#171b25"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>PixelStudio Mobile</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#171b25;color:#f1f4fa}header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 9px;background:#242b39;gap:8px}h1{font-size:18px;margin:0}button,select,input{font:inherit}button,.fileButton{border:1px solid #4a566c;border-radius:11px;background:#333f54;color:white;padding:10px 12px;min-height:42px;cursor:pointer}button.active{background:#2369b6;border-color:#8abaff}button:disabled{opacity:.4}button:focus-visible,input:focus-visible{outline:2px solid #7fb7ff}button.primary{background:#146fca}.actions,.tools{display:flex;gap:7px;overflow-x:auto;padding:9px 10px;scrollbar-width:thin}.actions{background:#202735}.tools{background:#2b3444}.tools button{white-space:nowrap}.workspace{height:clamp(290px,49dvh,720px);overflow:hidden;touch-action:none;position:relative;background:repeating-conic-gradient(#424b59 0 25%,#343c48 0 50%) 0 0/24px 24px}#stage{display:block;width:100%;height:100%;touch-action:none}.bottom{padding:10px 12px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px}.panel{background:#252e3e;border:1px solid #3e4a5e;border-radius:13px;padding:12px}h2{font-size:15px;margin:0 0 10px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{min-width:0}.row label{font-size:13px}input[type=number],input[type=text],select{background:#141c2b;color:#fff;border:1px solid #5a6b83;border-radius:8px;padding:9px;max-width:100%}input[type=range]{max-width:180px}input[type=color]{width:45px;height:42px;padding:2px;border:0;background:transparent}.layers{display:grid;gap:7px;max-height:230px;overflow:auto}.layer{display:flex;align-items:center;gap:6px;background:#303b4d;border-radius:9px;padding:7px;border:1px solid transparent}.layer.selected{border-color:#5cafff}.layer .name{flex:1;min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer button{padding:5px 8px;min-height:34px}.small{font-size:12px;color:#b6c5da}.notice{font-size:12px;color:#b8c7dc}dialog{border:1px solid #64758c;border-radius:16px;background:#222c3c;color:white;max-width:min(96vw,480px);width:100%;padding:18px}dialog::backdrop{background:#000a}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fields label{display:grid;gap:4px;font-size:12px}.fields .wide{grid-column:1/-1}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101927;color:white;border:1px solid #8aa0bf;padding:10px 16px;border-radius:12px;display:none;z-index:30;max-width:90vw}@media(min-width:850px){.app{max-width:1200px;margin:auto}.workspace{height:57dvh}.bottom{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header><h1>✦ PixelStudio <span class="small">Mobile 1.0</span></h1><button id="newBtn">Neu</button></header><nav class="actions" aria-label="Dateien"><button id="openImage">🖼 Bild</button><button id="openProject">📂 Projekt öffnen</button><button id="saveProject" class="primary">💾 Projekt</button><button id="exportPNG">PNG</button><button id="exportJPG">JPG</button><button id="undo">↶</button><button id="redo">↷</button></nav><nav class="tools" id="tools" aria-label="Werkzeuge"><button data-tool="move" class="active">✥ Verschieben</button><button data-tool="brush">🖌 Pinsel</button><button data-tool="erase">⌫ Radierer</button><button data-tool="pick">◉ Pipette</button><button data-tool="rect">▭ Rechteck</button><button data-tool="ellipse">◯ Ellipse</button><button data-tool="gradient">◩ Verlauf</button><button data-tool="select">▣ Auswahl</button><button data-tool="heal">✧ Retusche</button></nav><div class="workspace"><canvas id="stage" aria-label="Bildarbeitsfläche"></canvas></div><main class="bottom"><section class="panel"><h2>Werkzeug & Bild</h2><div class="row"><label>Farbe <input type="color" id="color" value="#ff6a55"></label><label>Größe <input type="range" id="size" min="1" max="100" value="12"></label><span id="sizeValue">12 px</span><button id="textAdd">T+ Text</button><button id="shapeAdd">+ Malebene</button></div><div class="row" style="margin-top:9px"><button id="filterBtn">🎛 Farbkorrektur</button><button id="removeBg">Hintergrund entfernen</button><button id="maskBtn">Maske aus Auswahl</button><button id="clearMask">Maske löschen</button></div><div class="row" style="margin-top:9px"><button id="cropBtn">Auswahl freistellen</button><button id="clearSel">Auswahl aufheben</button><button id="fitBtn">Ansicht anpassen</button></div><p class="notice">Ein Finger: malen, auswählen oder Ebene verschieben. Zwei Finger: zoomen und Arbeitsfläche verschieben. Beim Pinsel die gewünschte Bildebene auswählen.</p></section><section class="panel"><h2>Ebenen <span class="small">(oben = vorne)</span></h2><div id="layers" class="layers"></div><div class="row" style="margin-top:10px"><button id="duplicate">Duplizieren</button><button id="deleteLayer">Löschen</button><button id="editText">Text bearbeiten</button></div><div class="row" style="margin-top:8px"><label>Deckkraft <input id="opacity" type="range" min="0" max="100" value="100"></label><label>Mischmodus <select id="blend"><option value="normal">Normal</option><option value="multiply">Multiplizieren</option><option value="screen">Negativ multiplizieren</option><option value="overlay">Überlagern</option></select></label></div></section></main><input type="file" id="imageFile" accept="image/*" hidden><input type="file" id="projectFile" accept=".pxstudio,.pixelstudio,application/json" hidden></div>
<dialog id="textDialog"><h2>Text gestalten</h2><div class="fields"><label class="wide">Text<input id="textValue" type="text" value="Dein Text" maxlength="200"></label><label>Schriftart<select id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Times New Roman</option><option>Courier New</option><option>Impact</option><option>system-ui</option></select></label><label>Größe<input id="fontSize" type="number" value="65" min="6" max="300"></label><label>Schriftfarbe<input id="fontColor" type="color" value="#ffffff"></label><label>Konturfarbe<input id="strokeColor" type="color" value="#000000"></label><label>Konturbreite<input id="strokeWidth" type="number" value="2" min="0" max="30"></label><label>Schattengröße<input id="shadowBlur" type="number" value="0" min="0" max="60"></label><label>Schattenversatz<input id="shadowOffset" type="number" value="5" min="-60" max="60"></label><label>Schattenfarbe<input id="shadowColor" type="color" value="#000000"></label><label><input id="bold" type="checkbox"> Fett</label><label><input id="italic" type="checkbox"> Kursiv</label></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button id="cancelText">Abbrechen</button><button id="confirmText" class="primary">Übernehmen</button></div></dialog>
<div id="toast" role="status"></div><script src="app.js" defer></script></body></html>
